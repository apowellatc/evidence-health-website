<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Evidence Health logo</title>

  <defs>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20D4D2"/>
      <stop offset="100%" stop-color="#159DA4"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top signal bar -->
  <path
    d="M28 22 H87
       C97 22 102 28 102 36
       C102 44 97 50 87 50
       H12
       Z"
    fill="url(#tealGradient)"
  />

  <!-- Middle signal bar -->
  <path
    d="M12 51 H81
       C91 51 96 57 96 65
       C96 73 91 79 81 79
       H12
       C5 79 1 73 1 65
       C1 57 5 51 12 51
       Z"
    fill="url(#tealGradient)"
  />

  <!-- Bottom signal bar -->
  <path
    d="M47 80 H88
       C98 80 103 86 103 94
       C103 102 98 108 88 108
       H47
       L25 94
       Z"
    fill="url(#tealGradient)"
  />

  <!-- White signal connector -->
  <path
    d="M48 69 L27 92"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Signal node -->
  <circle
    cx="50"
    cy="67"
    r="10"
    fill="#FFFFFF"
    filter="url(#softGlow)"
  />

  <!-- Minimal orange ring -->
  <circle
    cx="50"
    cy="67"
    r="12.5"
    fill="none"
    stroke="#FF715B"
    stroke-width="2"
  />
</svg>
